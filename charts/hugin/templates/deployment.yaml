apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hugin.fullname" . }}
  labels: {{- include "hugin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  selector:
    matchLabels: {{- include "hugin.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hugin.selector" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pod when the configuration changes.
        checksum/config: {{ .Values.config | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "hugin.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hugin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HUGIN_BIND
              value: "0.0.0.0:8080"
            - name: HUGIN_OPS_BIND
              value: "0.0.0.0:8081"
            - name: HUGIN_CONFIG
              value: /config/config.json
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          ports:
            - name: http
              containerPort: 8080
            - name: ops
              containerPort: 8081
          readinessProbe:
            httpGet: { path: /healthz, port: ops }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: ops }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "hugin.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
