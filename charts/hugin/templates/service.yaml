apiVersion: v1
kind: Service
metadata:
  name: {{ include "hugin.fullname" . }}
  labels: {{- include "hugin.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "hugin.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
