{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.hugin.dev
  labels: {{- include "hugin.labels" . | nindent 4 }}
  annotations:
    # Uninstalling the chart must not delete hand-written widgets.
    helm.sh/resource-policy: keep
spec:
  group: hugin.dev
  scope: Namespaced
  names:
    kind: Widget
    listKind: WidgetList
    plural: widgets
    singular: widget
    categories: [hugin]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Description
          type: string
          jsonPath: .spec.description
        - name: Status
          type: string
          jsonPath: .status.message
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            A Lua widget script for the hugin dashboard. The generator writes
            one per service, named after the Ingress and owned by it. A
            hand-written Widget named like a service's `widget.type`, in the
            service's namespace or in hugin's, takes precedence.
          required: [spec]
          properties:
            spec:
              type: object
              properties:
                script:
                  type: string
                  description: The Lua script. See docs/widget-api.md in the hugin repository.
                  maxLength: 65536
                description:
                  type: string
                  description: What the script shows.
                  maxLength: 512
                serviceDescription:
                  type: string
                  description: >-
                    What the service is. Shown as the second line of its card
                    when the Ingress has no description annotation.
                  maxLength: 120
            status:
              type: object
              description: Set by the generator on widgets it wrote.
              properties:
                phase:
                  type: string
                  enum: [Ready, Failed]
                message:
                  type: string
                model:
                  type: string
                generatedAt:
                  type: string
                image:
                  type: string
                  nullable: true
                imageTag:
                  type: string
                  nullable: true
                inputHash:
                  type: string
                attempts:
                  type: integer
{{- end }}
