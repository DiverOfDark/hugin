[package]
name = "hugin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Small server-rendered homelab dashboard that discovers services from Kubernetes Ingress annotations"
repository = "https://github.com/DiverOfDark/hugin"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
http = "1"
k8s-openapi = { version = "0.29", features = ["v1_33"] }
kube = { version = "5", default-features = false, features = ["client", "runtime", "rustls-tls", "ring"] }
libc = "0.2.191"
maud = "0.27"
mlua = { version = "0.12", features = ["lua54", "vendored", "async", "send", "serialize"] }
prometheus-client = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "signal", "time", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
